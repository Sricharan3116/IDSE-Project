let AC,muted=false;function tone(f,d=.1,ty='sine',v=.05,w=0){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),q=AC.createGain(),T=AC.currentTime+w;o.type=ty;o.frequency.value=f;q.gain.setValueAtTime(v,T);q.gain.exponentialRampToValueAtTime(.0001,T+d);o.connect(q);q.connect(AC.destination);o.start(T);o.stop(T+d+.02)}catch(e){}}

{n:'Pick the Sensors',bg:['#06d6a0','#118ab2'],N:30,iv:1100,sd:[.2,.13],st:[.45,.65,.8],memo:'<b>Skill: feature selection.</b> Choose exactly 2 sensors and the robot trains itself on them. Some are useless, some are great. One looks too good to be true: near the end there is an <b>audit</b> with real production data.',lr:['Feature selection and leakage','A feature that looks perfect in training (price_tag) may not exist in production. That is data leakage. Good features are informative AND available at prediction time.']},

{n:'Drift Watch',bg:['#ff9f1c','#e71d36'],N:40,iv:950,mA:[.25,.65],mB:[.75,.35],sd:[.08,.08],ph:[{A:[.25,.65],B:[.75,.35]},{A:[.25,.65],B:[.5,.3]},{A:[.55,.72],B:[.85,.3]}],st:[.4,.55,.7],memo:'<b>Skill: monitoring and retraining.</b> Your model is frozen. When the weather changes the fruit, it gets worse. Watch the <b>quality monitor</b> and press <b>Retrain</b> at the right moment. Each retrain costs $25 and learns from the last 15 fruit.',lr:['Drift monitoring','Deployed models decay when the world changes. Teams monitor accuracy and retrain at the right time: too early wastes money, too late loses customers.']}];

let M={tp:0,tn:0,fp:0,fn:0},lv=0,C,items=[],dots=[],hist=[],fx=[],clog=[],mem=[],sel=[0,1],sp=0,cor=0,wr=0,wo=0,wl=0,prof=0,spT=0,spd=1,paused=false,run=false,W=[0,0],B0=0,H=[[.5,.05],[.5,.95]],ban='',banT=0,best=[0,0,0,0,0],rng,drag=-1,MA,MB,lastT=0,off=0,k=3,msz=30,retr=0,gp=null,seen={};
const gauss=()=>Math.sqrt(-2*Math.log(rng()+1e-9))*Math.cos(6.2832*rng()),cl=v=>Math.max(.02,Math.min(.98,v)),pt=f=>[f[sel[0]],f[sel[1]]],cv=v=>isFinite(v)?Math.max(0,Math.min(1,v)):.5;
function fromH(){const a=[H[0][0]-.5,H[0][1]-.5],c=[H[1][0]-.5,H[1][1]-.5];let n=[-(c[1]-a[1]),c[0]-a[0]];const L=Math.hypot(n[0],n[1])||1;n=[n[0]/L*10,n[1]/L*10];let bb=-(n[0]*a[0]+n[1]*a[1]);if(n[0]*(MA[0]-.5)+n[1]*(MA[1]-.5)+bb<n[0]*(MB[0]-.5)+n[1]*(MB[1]-.5)+bb){n=[-n[0],-n[1]];bb=-bb}W=n;B0=bb}

 else if(lv==2)s='# 1. Pick features\nX = df[["'+c0+'", "'+c1+'"]]\ny = df["is_lemon"]\n# 2. Train on them\nclf = SGDClassifier(loss="log_loss").partial_fit(X, y, classes=[0, 1])\n'+w+'\n# 3. Evaluate (audit uses production data)\naccuracy_score(y, clf.predict(X))   # '+a;
 else if(lv==3){const pa=mem.length?mem.filter(m=>knn(m.x,m.y)===m.l).length/mem.length:0;s='knn = KNeighborsClassifier(n_neighbors='+k+')\nknn.fit(X_memory, y_memory)   # '+mem.length+' rows\nknn.score(X_memory, y_memory) # practice: '+pa.toFixed(2)+'\nknn.score(X_new, y_new)       # REAL:     '+a}

 $('#code').innerHTML=hl(s);const f=v=>isFinite(v)?v.toFixed(2):'NaN';

function goLv(i){lv=i;C=ST[i];rng=mul(i*17+3);items=[];dots=[];hist=[];fx=[];clog=[];sp=0;cor=wr=wo=wl=prof=0;M={tp:0,tn:0,fp:0,fn:0};spT=C.iv-200;ban='';run=false;sel=[0,1];W=[0,0];B0=0;k=3;msz=30;retr=0;gp=null;H=[[.5,.05],[.5,.95]];MA=C.mA||[.25,.65];MB=C.mB||[.75,.35];fromH();
 mem=[];if(i==3)for(let n=0;n<8;n++){const c=n%2,m=c?C.mB:C.mA;mem.push({x:cl(m[0]+C.sd[0]*gauss()),y:cl(m[1]+C.sd[1]*gauss()),l:c})}

function spawn(){const c=rng()<.5?0:1,f=gen(c),it={f,c,px:0,res:0,dy:0,flaw:null};
